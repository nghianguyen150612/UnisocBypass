name: Offline research validation

on:
  push:
    branches: [main, "research/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linter
        run: python -m pip install --disable-pip-version-check ruff
      - name: Lint inspector and tests
        run: ruff check tools/inspect_uboot_ums9620.py tests/
      - name: Run synthetic unit tests
        run: python -m unittest discover -s tests -v
